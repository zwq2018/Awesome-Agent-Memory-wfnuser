name: "📄 Paper / Project 推荐"
description: "推荐一篇论文或一个开源项目到我们的调研列表"
title: "[Paper/Project] "
labels: ["backlog"]
body:
  - type: input
    id: title
    attributes:
      label: 标题
      description: 论文标题或项目名称
      placeholder: "例：MEM1: Learning to Synergize Memory and Reasoning"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - 📄 Paper
        - 🛠 Project
        - 📝 Survey
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Memory Architecture
        - RL-based Memory
        - Conversational Memory
        - Multi-Agent Memory
        - Evaluation
        - Other
    validations:
      required: true

  - type: dropdown
    id: venue
    attributes:
      label: Venue
      options:
        - ICLR 2026
        - NeurIPS 2025
        - ICML 2025
        - ACL 2025
        - EMNLP 2025
        - arXiv
        - GitHub
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 和我们方向的相关程度
      options:
        - 🔴 Must Read
        - 🟡 Worth Reading
        - 🔵 Nice to Have
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: 相关链接（paper / code / demo / dataset）
      placeholder: |
        - Paper: https://arxiv.org/abs/xxxx.xxxxx
        - Code: https://github.com/xxx/xxx
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 推荐理由（2-3句话）
      placeholder: "为什么值得读？和我们的方向有什么关系？"
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: Key Contribution（一句话）
      placeholder: "这篇工作最核心的贡献是什么？"
    validations:
      required: false
